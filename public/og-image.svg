<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F1"/>
      <stop offset="100%" stop-color="#EFEAE1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Border Card -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="#FCFBF9" stroke="#E5DACD" stroke-width="2"/>
  
  <!-- Badge -->
  <rect x="120" y="120" width="180" height="38" rx="19" fill="#F7F5F1" stroke="#E5DACD" stroke-width="1"/>
  <text x="210" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#716C66" text-anchor="middle" letter-spacing="1">PSICOLOGIA CLÍNICA</text>
  
  <!-- Main Title -->
  <text x="120" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="400" fill="#11100F" letter-spacing="-1.5">Antonia Elenita</text>
  <text x="120" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#A8610D">Psicóloga · CRP 06/232506</text>
  
  <!-- Subtitle -->
  <text x="120" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#55514D">Um espaço para compreender o que você sente e cuidar da sua saúde emocional.</text>
  
  <!-- Clinical Areas Chips -->
  <g transform="translate(120, 430)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#F7F5F1"/>
    <text x="95" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55514D" text-anchor="middle">Depressão e Ansiedade</text>
    
    <rect x="205" y="0" width="180" height="42" rx="21" fill="#F7F5F1"/>
    <text x="295" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55514D" text-anchor="middle">Regulação Emocional</text>
    
    <rect x="400" y="0" width="200" height="42" rx="21" fill="#F7F5F1"/>
    <text x="500" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55514D" text-anchor="middle">Uso de Substâncias</text>
    
    <rect x="615" y="0" width="165" height="42" rx="21" fill="#F7F5F1"/>
    <text x="697" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55514D" text-anchor="middle">Apoio a Familiares</text>
  </g>
  
  <!-- Monogram Brand Circle -->
  <circle cx="1010" cy="200" r="64" fill="#F7F5F1" stroke="#E5DACD" stroke-width="2"/>
  <text x="1010" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" fill="#A8610D" text-anchor="middle">AE</text>
</svg>
